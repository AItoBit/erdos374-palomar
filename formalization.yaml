version: "v0.4"
project:
  name: "Erdős 374: classical square products of factorials"
  description: >-
    Formalization of classical factorial-square constructions, exclusion of prime
    endpoints, existence of minimum representation cardinalities for composite
    endpoints, and the cutoff D_k = empty for k greater than six. The density
    question from Erdős problem 374 is defined but not proved. No mathematical
    novelty or solution of the density problem is claimed.
  authors: ["alexander"]
  responsible_maintainers: ["alexander"]
  license: MIT
classification:
  arxiv: [math.NT]
  msc2020: ["11D57", "11A41"]
sources:
  - title: "On products of factorials"
    authors: ["Paul Erdős", "Ronald L. Graham"]
    type: article
    id: "https://combinatorica.hu/~p_erdos/1976-25.pdf"
    location: "Bulletin of the Institute of Mathematics, Academia Sinica 4 (1976), 337–355"
    relationship: independently-proves
    note: >-
      Classical square-factorial constructions, prime obstruction and cutoff.
      The Lean file supplies elementary proofs of selected known conclusions;
      the entire paper is not formalized.
    author_endorsement: not-contacted
  - title: "Erdős Problem 374"
    authors: ["Thomas F. Bloom"]
    type: web discussion
    id: "https://www.erdosproblems.com/374"
    relationship: adapts
    note: >-
      Defines minimum-cardinality sets and the six-factor density question.
      This development proves selected classical supporting results only.
      The indexed page was consulted on 7 October 2026.
    author_endorsement: not-contacted
  - title: "Square products of factorials and a conjecture of Erdős and Graham"
    authors: ["Fedir Yudin"]
    type: preprint
    id: "https://arxiv.org/abs/2610.01899v1"
    relationship: background
    note: >-
      Posted 1 October 2026 and found during submission preparation. Its abstract
      claims density results beyond the scope of this Lean file. These claims
      have not been independently audited or formalized in this repository.
    author_endorsement: not-contacted
related_formalizations: []
status:
  scope: >-
    Eighteen compared theorems, detailed individually in README.md. HasRep uses
    distinct positive factorial arguments including the largest endpoint.
    InD minimizes among cardinalities at least two. PositiveLowerDensitySix is
    only a proposition definition. Neither exact minimality at 527, the converse
    characterization of D_2, nor asymptotics for D_3 through D_6 are proved.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
automation:
  methods:
    - method: agent
      models: ["GPT-6"]
      framework: "Codex"
      tool_setup: >-
        Submission packaging, import-path compatibility repair, bibliographic
        correction, independent Challenge extraction and verification setup.
        Original proof-generation methods were not supplied by the author.
  notes: >-
    The author supplied the Lean development and confirmed authorship. AI
    assistance with packaging is disclosed; original proof provenance beyond
    this confirmation is unspecified. Proofs use Mathlib tactics including
    ring, omega, nlinarith, norm_num and positivity.
fidelity:
  divergences: >-
    Selected classical results only. The six-factor construction at 527 proves
    existence and does not exclude shorter representations. The square result
    proves membership in D_2 for squares greater than one, not its converse.
    The minimum is represented relationally, without a default value when no
    representation exists. Density and modern preprint results are not proved.
review:
  status: "No independent human review reported"
  reviewers: []
  notes: >-
    Submission packaging includes static statement inspection. Lean, Comparator,
    and NanoDa verification is provided by the pinned full mechanical workflow.
    No human expert endorsement is claimed.
acknowledgements: "Lean, Mathlib, Comparator, NanoDa, and Palomar tooling."
